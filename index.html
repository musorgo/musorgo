<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>МусорGO — Личный кабинет</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1c1f;
      padding: 24px 16px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 700;
      color: #1a2a3a;
      letter-spacing: -0.3px;
    }
    .logo-box {
      background: #f5b042;
      border-radius: 12px;
      padding: 2px 10px;
      display: inline-block;
    }
    .logo-box span {
      font-size: 28px;
      font-weight: 700;
      color: #1a2a3a;
    }
    .user-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .user-email {
      font-size: 14px;
      color: #6c6c70;
      margin-bottom: 16px;
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .action-btn {
      background: none;
      border: 1px solid #007aff;
      color: #007aff;
      padding: 8px 24px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #e9f2ff;
    }
    .logout-btn {
      border-color: #ff3b30;
      color: #ff3b30;
    }
    .logout-btn:hover {
      background: #fee2e2;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 32px;
      border-bottom: 1px solid #e6e6e8;
      margin-bottom: 24px;
    }
    .tab {
      padding: 8px 0;
      font-size: 17px;
      font-weight: 500;
      color: #6c6c70;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: #007aff;
      border-bottom-color: #007aff;
    }
    .new-order-wrapper {
      text-align: center;
      margin-bottom: 24px;
    }
    .new-order-btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 44px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .order-item {
      background: white;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e6e6e8;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .order-id {
      font-weight: 600;
      font-size: 15px;
    }
    .order-status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      background: #f5f5f7;
    }
    .order-status.active {
      background: #d4f0ff;
      color: #007aff;
    }
    .order-status.completed {
      background: #e5f5e5;
      color: #2c6e2c;
    }
    .order-details {
      font-size: 14px;
      color: #6c6c70;
      margin-bottom: 12px;
    }
    .order-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .order-btn {
      background: none;
      border: 1px solid #007aff;
      color: #007aff;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .empty-message {
      text-align: center;
      color: #8e8e93;
      padding: 32px 0;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 28px;
      padding: 28px;
      max-width: 320px;
      width: 90%;
      text-align: center;
    }
    .modal-content input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e6e6e8;
      border-radius: 14px;
      font-size: 16px;
      margin: 16px 0;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .modal-btn {
      padding: 10px 20px;
      border-radius: 40px;
      border: none;
      font-weight: 500;
      cursor: pointer;
    }
    .save-btn {
      background: #007aff;
      color: white;
    }
    .cancel-btn {
      background: #e5e5ea;
      color: #1d1c1f;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <span class="logo-text">Мусор</span>
      <div class="logo-box"><span>GO</span></div>
    </div>
    <div class="user-name" id="userNameDisplay">Загрузка...</div>
    <div class="user-email" id="userEmailDisplay"></div>
    <div class="action-buttons">
      <button class="action-btn" id="editProfileBtn">Редактировать</button>
      <button class="action-btn logout-btn" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-order-tab="active">Активные заказы</div>
    <div class="tab" data-order-tab="completed">Завершённые</div>
  </div>

  <div class="new-order-wrapper">
    <a href="index.html" class="new-order-btn">+ Новый заказ</a>
  </div>

  <div id="activeOrders" class="orders-list"></div>
  <div id="completedOrders" class="orders-list" style="display: none;"></div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Редактировать профиль</h3>
    <input type="text" id="editNameInput" placeholder="Ваше имя">
    <div class="modal-buttons">
      <button class="modal-btn save-btn" id="saveNameBtn">Сохранить</button>
      <button class="modal-btn cancel-btn" id="cancelModalBtn">Отмена</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfNIlVyq0mdYylfR__zp1bg2uO7xapvoQ",
    authDomain: "musor-go.firebaseapp.com",
    projectId: "musor-go",
    storageBucket: "musor-go.firebasestorage.app",
    messagingSenderId: "249921799089",
    appId: "1:249921799089:web:1a740b067f4869a0a83390"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let userName = "";

  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (user && user.emailVerified) {
      await loadUserProfile(user);
      await loadOrders(user.email);
    } else if (user && !user.emailVerified) {
      document.getElementById('userEmailDisplay').innerText = user.email + ' (не подтверждён)';
    } else {
      window.location.href = 'index.html';
    }
  });

  async function loadUserProfile(user) {
    const userDoc = await db.collection('users').doc(user.uid).get();
    if (userDoc.exists) {
      userName = userDoc.data().name || user.email.split('@')[0];
    } else {
      userName = user.email.split('@')[0];
      await db.collection('users').doc(user.uid).set({ name: userName, email: user.email });
    }
    document.getElementById('userNameDisplay').innerText = userName;
    document.getElementById('userEmailDisplay').innerText = user.email;
  }

  async function loadOrders(email) {
    try {
      const snapshot = await db.collection('orders')
        .where('userEmail', '==', email)
        .orderBy('createdAt', 'desc')
        .get();

      const activeOrders = [];
      const completedOrders = [];

      snapshot.forEach(doc => {
        const order = { id: doc.id, ...doc.data() };
        if (order.status === 'выполнен') {
          completedOrders.push(order);
        } else {
          activeOrders.push(order);
        }
      });

      renderOrders(activeOrders, completedOrders);
    } catch (err) {
      console.error(err);
      document.getElementById('activeOrders').innerHTML = '<div class="empty-message">Ошибка загрузки заказов</div>';
    }
  }

  function renderOrders(active, completed) {
    const activeContainer = document.getElementById('activeOrders');
    const completedContainer = document.getElementById('completedOrders');

    if (active.length === 0) {
      activeContainer.innerHTML = '<div class="empty-message">У вас нет активных заказов</div>';
    } else {
      activeContainer.innerHTML = '';
      active.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `
          <div class="order-header">
            <span class="order-id">Заказ #${order.id.slice(0,6)}</span>
            <span class="order-status active">${order.status === 'ожидает оплаты' ? 'Ожидает оплаты' : order.status}</span>
          </div>
          <div class="order-details">${order.street}, ${order.house}, кв.${order.flat} • ${order.preferredDateTime || 'время не выбрано'}</div>
          <div class="order-buttons">
            <button class="order-btn track-btn" data-id="${order.id}">Отследить</button>
            <button class="order-btn repeat-btn" data-id="${order.id}">Повторить заказ</button>
          </div>
        `;
        activeContainer.appendChild(div);
      });
    }

    if (completed.length === 0) {
      completedContainer.innerHTML = '<div class="empty-message">У вас нет завершённых заказов</div>';
    } else {
      completedContainer.innerHTML = '';
      completed.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `
          <div class="order-header">
            <span class="order-id">Заказ #${order.id.slice(0,6)}</span>
            <span class="order-status completed">Выполнен</span>
          </div>
          <div class="order-details">${order.street}, ${order.house}, кв.${order.flat} • ${order.preferredDateTime || 'время не выбрано'}</div>
          <div class="order-buttons">
            <button class="order-btn repeat-btn" data-id="${order.id}">Заказать снова</button>
          </div>
        `;
        completedContainer.appendChild(div);
      });
    }

    document.querySelectorAll('.track-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.open(`index.html?order=${btn.dataset.id}`, '_blank');
      });
    });
    document.querySelectorAll('.repeat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = `index.html?repeat=${btn.dataset.id}`;
      });
    });
  }

  const tabs = document.querySelectorAll('.tab');
  const activeDiv = document.getElementById('activeOrders');
  const completedDiv = document.getElementById('completedOrders');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (tab.dataset.orderTab === 'active') {
        activeDiv.style.display = 'flex';
        completedDiv.style.display = 'none';
      } else {
        activeDiv.style.display = 'none';
        completedDiv.style.display = 'flex';
      }
    });
  });

  const editModal = document.getElementById('editModal');
  const editNameInput = document.getElementById('editNameInput');
  document.getElementById('editProfileBtn').onclick = () => {
    editNameInput.value = userName;
    editModal.style.display = 'flex';
  };
  document.getElementById('saveNameBtn').onclick = async () => {
    const newName = editNameInput.value.trim();
    if (newName && currentUser) {
      await db.collection('users').doc(currentUser.uid).update({ name: newName });
      userName = newName;
      document.getElementById('userNameDisplay').innerText = userName;
    }
    editModal.style.display = 'none';
  };
  document.getElementById('cancelModalBtn').onclick = () => {
    editModal.style.display = 'none';
  };
  window.onclick = (e) => {
    if (e.target === editModal) editModal.style.display = 'none';
  };

  document.getElementById('logoutBtn').onclick = async () => {
    if (confirm('Выйти из аккаунта?')) {
      await auth.signOut();
      // Перенаправляем на главную без перезагрузки страницы
      window.location.href = 'index.html';
    }
  };
</script>
</body>
</html>
