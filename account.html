<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>МусорGO — Личный кабинет</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      color: #1a2a3a;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .form-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }
    .input-group { margin-bottom: 18px; }
    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #4a5b6b;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 16px;
      background: #ffffff;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #1a2a3a;
      color: white;
      border: none;
      border-radius: 44px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-secondary {
      background: #f8fafc;
      color: #1a2a3a;
      border: 1px solid #e2e8f0;
      margin-top: 12px;
    }
    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 8px;
    }
    .success {
      color: #10b981;
      font-size: 13px;
      margin-top: 8px;
    }
    .link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }
    .link a {
      color: #f5b042;
      text-decoration: none;
    }
    .order-list {
      margin-top: 20px;
    }
    .order-item {
      background: #f8fafc;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .order-status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #eef2f5;
    }
    .order-details {
      font-size: 13px;
      color: #4a5b6b;
    }
    .logout-btn {
      background: none;
      border: 1px solid #e2e8f0;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="container" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
  // Конфигурация Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAfNIlVyq0mdYylfR__zp1bg2uO7xapvoQ",
    authDomain: "musor-go.firebaseapp.com",
    projectId: "musor-go",
    storageBucket: "musor-go.firebasestorage.app",
    messagingSenderId: "249921799089",
    appId: "1:249921799089:web:1a740b067f4869a0a83390"
  };
  
  // Инициализация
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Состояние готовности
  let isReady = false;

  // Функции
  function login() {
    const email = document.getElementById('loginEmail')?.value;
    const password = document.getElementById('loginPassword')?.value;
    const errorDiv = document.getElementById('loginError');
    
    if (!email || !password) {
      if (errorDiv) errorDiv.innerText = 'Заполните email и пароль';
      return;
    }
    
    if (errorDiv) errorDiv.innerText = '';
    
    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        // Успешно — onAuthStateChanged сам обновит интерфейс
      })
      .catch((err) => {
        if (errorDiv) errorDiv.innerText = err.message;
      });
  }

  function register() {
    const email = document.getElementById('regEmail')?.value;
    const password = document.getElementById('regPassword')?.value;
    const confirm = document.getElementById('regPasswordConfirm')?.value;
    const errorDiv = document.getElementById('registerError');
    
    if (!email || !password) {
      if (errorDiv) errorDiv.innerText = 'Заполните все поля';
      return;
    }
    
    if (password !== confirm) {
      if (errorDiv) errorDiv.innerText = 'Пароли не совпадают';
      return;
    }
    
    if (errorDiv) errorDiv.innerText = '';
    
    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        return userCredential.user.sendEmailVerification();
      })
      .then(() => {
        alert('На вашу почту отправлено письмо для подтверждения. После подтверждения войдите снова.');
        auth.signOut();
      })
      .catch((err) => {
        if (errorDiv) errorDiv.innerText = err.message;
      });
  }

  function showAuthForms() {
    document.getElementById('app').innerHTML = `
      <div class="form-card">
        <div class="section-title">Вход</div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="example@mail.ru">
        </div>
        <div class="input-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn" id="loginBtn">Войти</button>
        <div id="loginError" class="error"></div>
        <div class="link">
          Нет аккаунта? <a href="#" id="showRegisterLink">Зарегистрироваться</a>
        </div>
      </div>
    `;
    
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('showRegisterLink').onclick = (e) => {
      e.preventDefault();
      showRegisterForm();
    };
  }

  function showRegisterForm() {
    document.getElementById('app').innerHTML = `
      <div class="form-card">
        <div class="section-title">Регистрация</div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="example@mail.ru">
        </div>
        <div class="input-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" placeholder="••••••••">
        </div>
        <div class="input-group">
          <label>Повторите пароль</label>
          <input type="password" id="regPasswordConfirm" placeholder="••••••••">
        </div>
        <button class="btn" id="registerBtn">Зарегистрироваться</button>
        <div id="registerError" class="error"></div>
        <div class="link">
          Уже есть аккаунт? <a href="#" id="showLoginLink">Войти</a>
        </div>
      </div>
    `;
    
    document.getElementById('registerBtn').onclick = register;
    document.getElementById('showLoginLink').onclick = (e) => {
      e.preventDefault();
      showAuthForms();
    };
  }

  function showVerifyEmailPage(user) {
    document.getElementById('app').innerHTML = `
      <div class="form-card">
        <div class="section-title">Подтверждение email</div>
        <p>На адрес ${user.email} отправлено письмо для подтверждения. Пожалуйста, перейдите по ссылке в письме, чтобы активировать аккаунт.</p>
        <button class="btn" id="resendBtn">Отправить повторно</button>
        <button class="btn btn-secondary" id="logoutBtn">Выйти</button>
      </div>
    `;
    
    document.getElementById('resendBtn').onclick = () => {
      user.sendEmailVerification()
        .then(() => alert('Письмо отправлено повторно'))
        .catch(err => alert('Ошибка: ' + err.message));
    };
    document.getElementById('logoutBtn').onclick = () => auth.signOut();
  }

  async function showAccountPage(user) {
    try {
      const ordersSnapshot = await db.collection('orders')
        .where('userEmail', '==', user.email)
        .orderBy('createdAt', 'desc')
        .get();
      
      const orders = [];
      ordersSnapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));

      let ordersHtml = '';
      if (orders.length === 0) {
        ordersHtml = '<p>У вас пока нет заказов.</p>';
      } else {
        ordersHtml = '<div class="order-list">';
        orders.forEach(order => {
          let statusText = order.status;
          if (statusText === 'ожидает оплаты') statusText = 'Ожидает оплаты';
          else if (statusText === 'новый') statusText = 'Новый (оплачен)';
          else if (statusText === 'в работе') statusText = 'В работе';
          else if (statusText === 'выполнен') statusText = 'Выполнен';
          ordersHtml += `
            <div class="order-item">
              <div class="order-header">
                <span>Заказ #${order.id.slice(0,6)}</span>
                <span class="order-status">${statusText}</span>
              </div>
              <div class="order-details">
                ${order.street}, ${order.house}, кв.${order.flat}<br>
                ${order.preferredDateTime || ''}<br>
                ${order.deliveryType || ''}
              </div>
              <div class="order-details" style="margin-top: 8px;">
                <a href="${window.location.origin}?order=${order.id}" target="_blank">Отследить</a>
              </div>
            </div>
          `;
        });
        ordersHtml += '</div>';
      }

      document.getElementById('app').innerHTML = `
        <div class="form-card">
          <div class="header">
            <div class="section-title" style="margin-bottom: 0;">Личный кабинет</div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
          </div>
          <p><strong>${user.email}</strong> (подтверждён)</p>
          <div class="section-title" style="margin-top: 20px; font-size: 18px;">Мои заказы</div>
          ${ordersHtml}
        </div>
      `;
      
      document.getElementById('logoutBtn').onclick = () => auth.signOut();
    } catch (err) {
      console.error('Ошибка загрузки заказов:', err);
      document.getElementById('app').innerHTML = `
        <div class="form-card">
          <div class="section-title">Ошибка</div>
          <p>Не удалось загрузить заказы. Попробуйте обновить страницу.</p>
          <button class="btn" onclick="location.reload()">Обновить</button>
        </div>
      `;
    }
  }

  // Слушатель состояния авторизации
  auth.onAuthStateChanged(user => {
    if (user) {
      if (!user.emailVerified) {
        showVerifyEmailPage(user);
      } else {
        showAccountPage(user);
      }
    } else {
      showAuthForms();
    }
  });
</script>
</body>
</html>
