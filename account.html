<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>МусорGO — Личный кабинет</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1c1f;
      padding: 24px 16px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    /* Верхняя строка: логотип слева, email справа */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: #1a2a3a;
      letter-spacing: -0.3px;
    }
    .logo-box {
      background: #f5b042;
      border-radius: 12px;
      padding: 2px 10px;
      display: inline-block;
    }
    .logo-box span {
      font-size: 24px;
      font-weight: 700;
      color: #1a2a3a;
    }
    .user-area {
      text-align: right;
    }
    .user-email {
      font-size: 15px;
      font-weight: 500;
      color: #1d1c1f;
      background: white;
      padding: 6px 16px;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .logout-btn {
      background: none;
      border: none;
      font-size: 14px;
      color: #ff3b30;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 20px;
      transition: background 0.2s;
    }
    .logout-btn:hover {
      background: #fee2e2;
    }
    /* Вкладки */
    .tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid #e6e6e8;
      margin: 24px 0 20px 0;
    }
    .tab {
      padding: 8px 0;
      font-size: 17px;
      font-weight: 500;
      color: #6c6c70;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: #007aff;
      border-bottom-color: #007aff;
    }
    /* Кнопка Новый заказ (по центру) */
    .new-order-wrapper {
      text-align: center;
      margin-bottom: 24px;
    }
    .new-order-btn {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 44px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    /* Списки заказов */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .order-item {
      background: white;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e6e6e8;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .order-id {
      font-weight: 600;
      font-size: 15px;
    }
    .order-status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      background: #f5f5f7;
    }
    .order-status.active {
      background: #d4f0ff;
      color: #007aff;
    }
    .order-status.completed {
      background: #e5f5e5;
      color: #2c6e2c;
    }
    .order-details {
      font-size: 14px;
      color: #6c6c70;
      margin-bottom: 12px;
    }
    .repeat-btn {
      background: none;
      border: 1px solid #007aff;
      color: #007aff;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .empty-message {
      text-align: center;
      color: #8e8e93;
      padding: 32px 0;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Верхняя строка -->
  <div class="top-bar">
    <div class="logo">
      <span class="logo-text">Мусор</span>
      <div class="logo-box"><span>GO</span></div>
    </div>
    <div class="user-area">
      <div class="user-email" id="userEmailDisplay">загрузка...</div>
      <div><button class="logout-btn" id="logoutBtn">Выйти</button></div>
    </div>
  </div>

  <!-- Вкладки -->
  <div class="tabs">
    <div class="tab active" data-order-tab="active">Активные заказы</div>
    <div class="tab" data-order-tab="completed">Завершённые</div>
  </div>

  <!-- Кнопка Новый заказ по центру -->
  <div class="new-order-wrapper">
    <a href="index.html" class="new-order-btn">+ Новый заказ</a>
  </div>

  <!-- Активные заказы -->
  <div id="activeOrders" class="orders-list"></div>

  <!-- Завершённые заказы (скрыт) -->
  <div id="completedOrders" class="orders-list" style="display: none;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfNIlVyq0mdYylfR__zp1bg2uO7xapvoQ",
    authDomain: "musor-go.firebaseapp.com",
    projectId: "musor-go",
    storageBucket: "musor-go.firebasestorage.app",
    messagingSenderId: "249921799089",
    appId: "1:249921799089:web:1a740b067f4869a0a83390"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;

  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (user && user.emailVerified) {
      document.getElementById('userEmailDisplay').innerText = user.email;
      await loadOrders(user.email);
    } else if (user && !user.emailVerified) {
      document.getElementById('userEmailDisplay').innerText = user.email + ' (не подтверждён)';
    } else {
      window.location.href = 'index.html';
    }
  });

  async function loadOrders(email) {
    try {
      const snapshot = await db.collection('orders')
        .where('userEmail', '==', email)
        .orderBy('createdAt', 'desc')
        .get();

      const activeOrders = [];
      const completedOrders = [];

      snapshot.forEach(doc => {
        const order = { id: doc.id, ...doc.data() };
        if (order.status === 'выполнен') {
          completedOrders.push(order);
        } else {
          activeOrders.push(order);
        }
      });

      renderOrders(activeOrders, completedOrders);
    } catch (err) {
      console.error(err);
      document.getElementById('activeOrders').innerHTML = '<div class="empty-message">Ошибка загрузки заказов</div>';
    }
  }

  function renderOrders(active, completed) {
    const activeContainer = document.getElementById('activeOrders');
    const completedContainer = document.getElementById('completedOrders');

    if (active.length === 0) {
      activeContainer.innerHTML = '<div class="empty-message">У вас нет активных заказов</div>';
    } else {
      activeContainer.innerHTML = '';
      active.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `
          <div class="order-header">
            <span class="order-id">Заказ #${order.id.slice(0,6)}</span>
            <span class="order-status active">${order.status === 'ожидает оплаты' ? 'Ожидает оплаты' : order.status}</span>
          </div>
          <div class="order-details">${order.street}, ${order.house}, кв.${order.flat} • ${order.preferredDateTime || 'время не выбрано'}</div>
          <button class="repeat-btn" data-id="${order.id}">Повторить заказ</button>
        `;
        activeContainer.appendChild(div);
      });
    }

    if (completed.length === 0) {
      completedContainer.innerHTML = '<div class="empty-message">У вас нет завершённых заказов</div>';
    } else {
      completedContainer.innerHTML = '';
      completed.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `
          <div class="order-header">
            <span class="order-id">Заказ #${order.id.slice(0,6)}</span>
            <span class="order-status completed">Выполнен</span>
          </div>
          <div class="order-details">${order.street}, ${order.house}, кв.${order.flat} • ${order.preferredDateTime || 'время не выбрано'}</div>
          <button class="repeat-btn" data-id="${order.id}">Заказать снова</button>
        `;
        completedContainer.appendChild(div);
      });
    }

    // Обработчики повторного заказа
    document.querySelectorAll('.repeat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = `index.html?repeat=${btn.dataset.id}`;
      });
    });
  }

  // Переключение вкладок
  const tabs = document.querySelectorAll('.tab');
  const activeDiv = document.getElementById('activeOrders');
  const completedDiv = document.getElementById('completedOrders');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (tab.dataset.orderTab === 'active') {
        activeDiv.style.display = 'flex';
        completedDiv.style.display = 'none';
      } else {
        activeDiv.style.display = 'none';
        completedDiv.style.display = 'flex';
      }
    });
  });

  // Выход
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (confirm('Выйти из аккаунта?')) {
      await auth.signOut();
      window.location.href = 'index.html';
    }
  });
</script>
</body>
</html>
